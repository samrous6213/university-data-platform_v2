x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0-python3.11
  user: "50000:0" # Fix permission issues
  restart: unless-stopped
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: vYfG7ghjptCRD1O9Becs48DIlg9pPQa_eM0Iqjx_amE=
    AIRFLOW__WEBSERVER__SECRET_KEY: 5c4132f67a66d77573e0ecec82a97d75dade94d43936863320192e63f12942b0
    AIRFLOW__API__SECRET_KEY: 5c4132f67a66d77573e0ecec82a97d75dade94d43936863320192e63f12942b0
    AIRFLOW__API_AUTH__JWT_SECRET: 5c4132f67a66d77573e0ecec82a97d75dade94d43936863320192e63f12942b0
    AIRFLOW__CORE__DEFAULT_TASK_EXECUTION_TIMEOUT: 3600 
    AIRFLOW__WEBSERVER__WORKER_TIMEOUT: 3600 
    AIRFLOW__HOSTNAME_COMMAND: "echo localhost"
    AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"  
    TZ: "UTC"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./requirements.txt:/requirements.txt

services:
  minio:
    image: minio/minio:latest
    container_name: university-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:13
    container_name: university-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5435:5432" # Changed from 5432 to 5435 (avoid conflicts)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      DB_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: metastore
      DATABASE_USER: hive
      DATABASE_PASSWORD: hive
      HIVE_METASTORE_JDBC_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9083:9083"
    volumes:
      - hive_data:/opt/hive/data

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8090:8080" # Changed from 8080 to 8090
    user: root

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_started
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: university-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g # Augmenté
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  metabase:
    image: metabase/metabase:v0.56.6
    container_name: university-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metastore
      MB_DB_PORT: 5432
      MB_DB_USER: hive
      MB_DB_PASS: hive
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"

  airflow-postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5436:5432" # Changed from 5433 to 5436

  airflow-init:
    <<: *airflow-common
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com "

  airflow-webserver:
    <<: *airflow-common
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-webserver
    restart: unless-stopped
    hostname: airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: "5c4132f67a66d77573e0ecec82a97d75dade94d43936863320192e63f12942b0"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WORKER_TIMEOUT: 1800
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: 1800
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__HOSTNAME_COMMAND: "echo airflow-webserver"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8081"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__LOGGING__SERVE_LOGS: "true"
      AIRFLOW__WEBSERVER__RELOAD: "false"  # Désactive le rechargement automatique
      AIRFLOW__WEBSERVER__LOG_SERVER_HOST: "airflow-scheduler"
      AIRFLOW__WEBSERVER__LOG_FETCH_TIMEOUT_SEC: "30"
    command: webserver --workers 1 --debug  # MODE DEBUG (pas de Gunicorn)
    ports:
      - "8081:8080"
    user: root

  airflow-scheduler:
    <<: *airflow-common
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-scheduler
    restart: unless-stopped
    hostname: airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__WEBSERVER__SECRET_KEY: "5c4132f67a66d77573e0ecec82a97d75dade94d43936863320192e63f12942b0"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__HOSTNAME_COMMAND: "echo airflow-scheduler"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__LOGGING__SERVE_LOGS: "true"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"
    command: scheduler
    

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

volumes:
  minio_data:
  postgres_data:
  elasticsearch_data:
  hive_data:
