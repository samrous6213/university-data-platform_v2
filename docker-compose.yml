version: '3.8'

services:
  # ────────────────────────────────────────
  # 1. MINIO (Stockage Objet)
  # ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: university-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # API S3
      - "9001:9001"      # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ────────────────────────────────────────
  # 2. POSTGRES (pour Hive Metastore)
  # ────────────────────────────────────────
  postgres:
    image: postgres:13
    container_name: university-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # 3. HIVE METASTORE (Catalogue SQL / PostgreSQL)
  # ────────────────────────────────────────
  hive-metastore:
    build:
      context: ./scripts/hive/metastore
      dockerfile: Dockerfile
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      METASTORE_DB_HOSTNAME: postgres
      METASTORE_DB_PORT: "5432"
      METASTORE_DB_NAME: metastore
      METASTORE_DB_USER: hive
      METASTORE_DB_PASSWORD: hive
      METASTORE_WAREHOUSE_DIR: /user/hive/warehouse
      HIVE_METASTORE_PORT: "9083"
      S3A_ENDPOINT: http://university-minio:9000
      S3A_ACCESS_KEY: minioadmin
      S3A_SECRET_KEY: minioadmin
      S3A_PATH_STYLE_ACCESS: "true"
      S3A_SSL_ENABLED: "false"
      S3A_IMPL_DISABLE_CACHE: "true"
      S3A_CREDENTIALS_PROVIDER: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9083:9083"

  # ────────────────────────────────────────
  # 4. HIVE SERVER (SQL endpoint / HiveServer2)
  # ────────────────────────────────────────
  hive-server:
    build:
      context: ./scripts/hive
      dockerfile: Dockerfile.hive
    container_name: university-hive-server
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_SITE_CONF_hive_metastore_uris: thrift://hive-metastore:9083
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: /user/hive/warehouse
      HIVE_SITE_CONF_hive_server2_thrift_port: "10000"
      HIVE_SITE_CONF_hive_server2_webui_port: "10002"
      HIVE_SITE_CONF_fs_s3a_endpoint: http://university-minio:9000
      HIVE_SITE_CONF_fs_s3a_access_key: minioadmin
      HIVE_SITE_CONF_fs_s3a_secret_key: minioadmin
      HIVE_SITE_CONF_fs_s3a_path_style_access: "true"
      HIVE_SITE_CONF_fs_s3a_connection_ssl_enabled: "false"
      HIVE_SITE_CONF_fs_s3a_impl_disable_cache: "true"
      HIVE_SITE_CONF_fs_s3a_aws_credentials_provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      HIVE_SITE_CONF_hive_fetch_task_conversion: more
      HIVE_SITE_CONF_hive_exec_mode_local_auto: "true"
      HADOOP_HEAPSIZE: "2048"
      S3A_ENDPOINT: http://university-minio:9000
      S3A_ACCESS_KEY: minioadmin
      S3A_SECRET_KEY: minioadmin
      S3A_PATH_STYLE_ACCESS: "true"
      S3A_SSL_ENABLED: "false"
      S3A_IMPL_DISABLE_CACHE: "true"
      S3A_CREDENTIALS_PROVIDER: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "10000:10000"
      - "10002:10002"

  # ────────────────────────────────────────
  # 5. SPARK MASTER (Chef)
  # ────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
      - spark_home:/home/spark
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"   # Communication avec les workers
      - "8080:8080"   # UI Web (accessible sur http://localhost:8080)
    environment:
      SPARK_MASTER_HOST: spark-master
      PYSPARK_PYTHON: /usr/bin/python3
      PYTHONPATH: /opt/spark/work-dir

  # ────────────────────────────────────────
  # 6. SPARK WORKER (Esclave)
  # ────────────────────────────────────────
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./scripts:/opt/spark/work-dir/scripts
      - spark_home:/home/spark
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      PYSPARK_PYTHON: /usr/bin/python3
      PYTHONPATH: /opt/spark/work-dir
    ports:
      - "8082:8081"   # UI Web (accessible sur http://localhost:8082)

  # ────────────────────────────────────────
  # 7. ELASTICSEARCH (Recherche plein-texte)
  # ────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: university-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────────────
  # 8. QDRANT (Recherche vectorielle / RAG)
  # ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: university-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ────────────────────────────────────────
  # 9. METABASE (BI / Dashboards)
  # ────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.56.6
    container_name: university-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metastore
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: hive
      MB_DB_PASS: hive

  # ────────────────────────────────────────
  # 10. POSTGRES (pour Airflow)
  # ────────────────────────────────────────
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # 11. AIRFLOW INIT (Création du compte admin)
  # ────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "docker requests beautifulsoup4 pdfplumber PyPDF2 minio elasticsearch python-dotenv"
    command: >
      bash -c "
      pip install docker requests beautifulsoup4 pdfplumber PyPDF2 minio elasticsearch python-dotenv --quiet &&
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - /var/run/docker.sock:/var/run/docker.sock

  # ────────────────────────────────────────
  # 12. AIRFLOW WEBSERVER (UI)
  # ────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "docker requests beautifulsoup4 pdfplumber PyPDF2 minio elasticsearch python-dotenv"
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver
    ports:
      - "8081:8080"   # UI Airflow (accessible sur http://localhost:8081)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────────────
  # 13. AIRFLOW SCHEDULER
  # ────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "docker requests beautifulsoup4 pdfplumber PyPDF2 minio elasticsearch python-dotenv"
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

# ────────────────────────────────────────
# NETWORKS (no underscores in name to avoid Java URISyntaxException)
# ────────────────────────────────────────
networks:
  default:
    name: univnet

# ────────────────────────────────────────
# VOLUMES PERSISTANTS
# ────────────────────────────────────────
volumes:
  minio_data:
  postgres_data:
  elasticsearch_data:
  qdrant_data:
  airflow_postgres_data:
  spark_home: