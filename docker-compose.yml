# ── Ancre YAML : config commune aux 3 services Airflow ──────────────────
# Evite de dupliquer 15 lignes identiques x3. IMPORTANT : cette cle x-* doit
# rester au niveau RACINE du fichier (ici, avant "services:"), pas a
# l'interieur du bloc "services:" -- sinon Compose la traite comme un vrai
# service a builder/lancer (bug rencontre en pratique : un conteneur
# fantome "x-airflow-common" apparait dans "docker compose ps").
#
# Les variables HIVE_METASTORE_URI / ELASTICSEARCH_HOST /
# POSTGRES_ANALYTICS_HOST / MINIO_ENDPOINT ci-dessous SURCHARGENT
# volontairement les defaults localhost/127.0.0.1 de configs/spark_config.py
# (penses pour l'ancienne execution native Windows) par les noms de service
# du reseau Docker, maintenant que l'ingestion ET Spark tournent DANS le
# conteneur Airflow.
#
# Le fichier ./.env est monte tel quel (variables OpenAlex/CKAN, cles
# MinIO, etc.) : load_dotenv() ne redefinit jamais une variable deja
# presente dans l'environnement (comportement par defaut, override=False),
# donc les 4 overrides ci-dessous gagnent toujours sur .env, meme si son
# MINIO_ENDPOINT=127.0.0.1:9000 (correct pour Windows natif) y reste tel quel.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: university-airflow:latest
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__WEBSERVER__SECRET_KEY: "un_secret_partage_pour_le_mvp_12345"
    PYTHONPATH: /opt/airflow
    PYTHONIOENCODING: utf-8
    HIVE_METASTORE_URI: thrift://hive-metastore:9083
    ELASTICSEARCH_HOST: elasticsearch
    ELASTICSEARCH_PORT: "9200"
    POSTGRES_ANALYTICS_HOST: postgres
    POSTGRES_ANALYTICS_PORT: "5432"
    MINIO_ENDPOINT: minio:9000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./configs:/opt/airflow/configs
    - ./jdbc:/opt/airflow/jdbc
    - ./logs:/opt/airflow/logs
    - ./.env:/opt/airflow/.env:ro
    - airflow_ivy_cache:/home/airflow/.ivy2

services:

  minio:
    image: minio/minio:latest
    container_name: university-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:13
    container_name: university-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    restart: unless-stopped

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: "/opt/hadoop/share/hadoop/tools/lib/*"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "9083:9083"

    volumes:
      - ./jdbc/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar:ro
      - ./configs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - hive_warehouse:/opt/hive/data/warehouse

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: university-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  metabase:
    image: metabase/metabase:v0.56.6
    container_name: university-metabase
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      - airflow-postgres
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-postgres
      - airflow-init
    command: webserver
    ports:
      - "8081:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-postgres
      - airflow-init
    command: scheduler
    ports:
      # Permet de lancer manuellement l'API de recherche (uvicorn) DANS ce
      # conteneur (voir RUNBOOK section 5) : toutes ses dependances
      # (fastapi, uvicorn, elasticsearch) sont deja dans l'image custom.
      # Le port reste inactif tant qu'uvicorn n'est pas lance manuellement.
      - "8000:8000"

volumes:
  minio_data:
  postgres_data:
  elasticsearch_data:
  hive_warehouse:
  airflow_ivy_cache: