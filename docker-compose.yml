version: '3.8'

services:
  # ────────────────────────────────────────
  # 1. MINIO (Stockage Objet)
  # ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: university-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # API S3
      - "9001:9001"      # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ────────────────────────────────────────
  # 1b. MINIO BUCKET INIT
  # ────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-json &&
      mc mb --ignore-existing local/raw-html &&
      mc mb --ignore-existing local/raw-documents &&
      mc mb --ignore-existing local/raw-images &&
      mc mb --ignore-existing local/raw-logs &&
      mc mb --ignore-existing local/raw-web-html &&
      mc mb --ignore-existing local/hudi &&
      echo 'All buckets created.'
      "

  # ────────────────────────────────────────
  # 2. POSTGRES (pour Hive Metastore)
  # ────────────────────────────────────────
  postgres:
    image: postgres:13
    container_name: university-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # 2b. POSTGRES (pour Metabase)
  # ────────────────────────────────────────
  metabase-postgres:
    image: postgres:13
    container_name: university-metabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    ports:
      - "5434:5432"
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # 3. HIVE METASTORE (Catalogue SQL)
  # ────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      METASTORE_DB_HOST: postgres
      METASTORE_DB_PORT: 5432
      METASTORE_DB_NAME: metastore
      METASTORE_DB_USER: hive
      METASTORE_DB_PASSWORD: hive
      METASTORE_PORT: 9083
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    ports:
      - "9083:9083"

  # ────────────────────────────────────────
  # 4. SPARK MASTER (Chef)
  # ────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    restart: unless-stopped
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: http://university-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  # ────────────────────────────────────────
  # 5. SPARK WORKER (Esclave)
  # ────────────────────────────────────────
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: http://university-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8081"

  # ────────────────────────────────────────
  # 5b. SPARK THRIFT SERVER (JDBC/ODBC)
  # ────────────────────────────────────────
  spark-thrift:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-thrift
    restart: unless-stopped
    depends_on:
      - spark-master
      - hive-metastore
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    command: >
      bash -c "/opt/spark/sbin/start-thriftserver.sh
      --master spark://spark-master:7077
      --hiveconf hive.metastore.uris=thrift://hive-metastore:9083
      --conf spark.sql.catalogImplementation=hive
      --conf spark.hadoop.fs.s3a.endpoint=http://university-minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      && tail -f /dev/null"
    ports:
      - "10000:10000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: http://university-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

  # ────────────────────────────────────────
  # 6. ELASTICSEARCH (Recherche plein-texte)
  # ────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: university-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────────────
  # 7. QDRANT (Recherche vectorielle / RAG)
  # ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: university-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ────────────────────────────────────────
  # 8. METABASE (BI / Dashboards)
  # ────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.56.6
    container_name: university-metabase
    restart: unless-stopped
    depends_on:
      metabase-postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: metabase-postgres
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase

  # ────────────────────────────────────────
  # 9. POSTGRES (pour Airflow)
  # ────────────────────────────────────────
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # 10. AIRFLOW INIT (Création du compte admin)
  # ────────────────────────────────────────
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "115yy9L1p08Fi_CtIh8QyWuiECYL1fK7WBBaOUlTu1I="
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src

  # ────────────────────────────────────────
  # 11. AIRFLOW WEBSERVER (UI)
  # ────────────────────────────────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "e277777f8e45232f248ef3b223ad2f52439873cdb93b0c8aa6608f04bae6c42e"
      AIRFLOW__CORE__FERNET_KEY: "115yy9L1p08Fi_CtIh8QyWuiECYL1fK7WBBaOUlTu1I="
      PYTHONPATH: /opt/spark/work-dir
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
    command: webserver
    ports:
      - "8081:8080"   # UI Airflow (accessible sur http://localhost:8081)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ────────────────────────────────────────
  # 12. AIRFLOW SCHEDULER
  # ────────────────────────────────────────
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "e277777f8e45232f248ef3b223ad2f52439873cdb93b0c8aa6608f04bae6c42e"
      AIRFLOW__CORE__FERNET_KEY: "115yy9L1p08Fi_CtIh8QyWuiECYL1fK7WBBaOUlTu1I="
      PYTHONPATH: /opt/spark/work-dir
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
    command: scheduler

# ────────────────────────────────────────
# VOLUMES PERSISTANTS
# ────────────────────────────────────────
volumes:
  minio_data:
  postgres_data:
  metabase_postgres_data:
  elasticsearch_data:
  qdrant_data:
  airflow_postgres_data:
